name: Private Coalescent CI (ephemeral)

# Run only when a Testing maintainer explicitly chooses Run workflow.
# Never run private-code jobs on pull_request, pull_request_target, or forks.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private coalescent-research branch, tag or full SHA (this ref is public run metadata)'
        required: true
        type: string
        default: research/schi-next-reversible-step
      suite:
        description: 'Select a finite research validation suite'
        required: true
        type: choice
        options:
          - schi-next
          - lean-smoke
          - both
          - theory-krk
          - theory-lean
          - theory-controller
          - web-krk
          - uniform-krk
          - uniform-black-krk
          - materialized-krk
        default: schi-next

permissions:
  contents: read

concurrency:
  group: ephemeral-private-research-runner
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only private checkout / public-safe results
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public Testing toolchain (no credentials persisted)
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false

      - name: Validate private read-only deploy key is configured
        env:
          KEY: ${{ secrets.COALESCENT_DEPLOY_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo '::error::Missing Testing repository secret COALESCENT_DEPLOY_KEY. See README (read-only deploy key setup).'
            exit 1
          fi

      - name: Install public Qiskit dependencies (no private source yet)
        if: ${{ (inputs.suite || 'materialized-krk') == 'schi-next' || (inputs.suite || 'materialized-krk') == 'both' || (inputs.suite || 'materialized-krk') == 'theory-krk' || (inputs.suite || 'materialized-krk') == 'theory-controller' || (inputs.suite || 'materialized-krk') == 'web-krk' || (inputs.suite || 'materialized-krk') == 'uniform-krk' || (inputs.suite || 'materialized-krk') == 'uniform-black-krk' || (inputs.suite || 'materialized-krk') == 'materialized-krk' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned public Python dependencies without caching output
        if: ${{ (inputs.suite || 'materialized-krk') == 'schi-next' || (inputs.suite || 'materialized-krk') == 'both' || (inputs.suite || 'materialized-krk') == 'theory-krk' || (inputs.suite || 'materialized-krk') == 'theory-controller' || (inputs.suite || 'materialized-krk') == 'web-krk' || (inputs.suite || 'materialized-krk') == 'uniform-krk' || (inputs.suite || 'materialized-krk') == 'uniform-black-krk' || (inputs.suite || 'materialized-krk') == 'materialized-krk' }}
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/public-deps.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! python -m pip install --disable-pip-version-check -r tooling/requirements.txt >"$log_file" 2>&1; then
            echo '::error::Public Qiskit dependencies failed to install.'
            exit 1
          fi
          echo 'Pinned public Qiskit dependencies installed.'

      - name: Checkout private research repository (runner-local only)
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/coalescent-research
          ref: ${{ (inputs.source_ref || 'experiment/krk-19q-occupancy-permutation') }}
          path: private-src
          ssh-key: ${{ secrets.COALESCENT_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Run SCHI-Next tests without exposing private tracebacks
        if: ${{ (inputs.suite || 'materialized-krk') == 'schi-next' || (inputs.suite || 'materialized-krk') == 'both' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-python.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 2400s python -B -m unittest discover -s chess/experiments/schi_next -p 'test_*.py' -q >"$log_file" 2>&1; then
            echo '::error::Private SCHI-Next tests failed or timed out. Full output intentionally withheld from public logs.'
            exit 1
          fi
          echo 'Private SCHI-Next suite: PASS (individual private test output suppressed).'

      - name: Configure Lean 4 and Mathlib without public build cache
        if: ${{ (inputs.suite || 'materialized-krk') == 'lean-smoke' || (inputs.suite || 'materialized-krk') == 'both' || (inputs.suite || 'materialized-krk') == 'theory-lean' }}
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          lake-package-directory: private-src/lean-proofs
          auto-config: 'false'
          build: 'false'
          leanchecker: false
          use-mathlib-cache: 'true'
          use-github-cache: 'false'

      - name: Build private Lean smoke theorem (quiet public logs)
        if: ${{ (inputs.suite || 'materialized-krk') == 'lean-smoke' || (inputs.suite || 'materialized-krk') == 'both' }}
        working-directory: private-src/lean-proofs
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-lean.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 2400s lake build RecordAlgebra.Kernel.FiniteModel >"$log_file" 2>&1; then
            echo '::error::Private Lean build failed or timed out. Proof output intentionally withheld from public logs.'
            exit 1
          fi
          echo 'Private Lean smoke target: PASS (private output suppressed).'


      - name: Checkout merged KRK-v1 canonical source (runner-local, theory only)
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-krk' }}
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/coalescent-research
          ref: main
          path: canonical-src
          ssh-key: ${{ secrets.COALESCENT_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Stage canonical KRK semantics for cross-ref tests, without a commit
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-krk' }}
        run: |
          mkdir -p -- private-src/chess/quantum_krk
          cp -a -- canonical-src/chess/quantum_krk/classical private-src/chess/quantum_krk/
          echo 'Private canonical KRK-v1 staged for cross-reference checks (no publication).'

      # These checks read private theory sources from runner-local private-src.
      # Public workflow source contains only generic test/compile invocations.
      - name: Check private KRK geometry, D4 symmetry and adversarial policy
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-krk' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-krk.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          tests=(
            test_directional_step.py
            test_krk_dihedral_record.py
            test_geometric_progress.py
            test_uniform_rank_reference.py
            test_canonical_factored_step.py
            test_canonical_dihedral_record.py
          )
          for test_file in "${tests[@]}"; do
            if ! timeout 600s python -B -m unittest discover \
                -s research/chess/theory -p "$test_file" -q >"$log_file" 2>&1; then
              echo '::error::Private KRK theory tests failed or timed out. Tracebacks intentionally withheld.'
              exit 1
            fi
          done
          echo 'Private KRK geometry / D4 / rank reference: PASS (output suppressed).'

      - name: Compile complete private directional KRK step with Qiskit
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-krk' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-qiskit-krk.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 1200s python -B - <<'PY' >"$log_file" 2>&1
          import sys
          sys.path.insert(0, "research/chess/theory")
          from directional_step import directional_circuit, run_directional
          from qiskit import QuantumCircuit, transpile
          from qiskit_aer import AerSimulator
          from uniform_step import encode_state
          from test_uniform_step import State
          src = directional_circuit()
          assert src.total_qubits == 155
          assert len(src.gates) == 4507
          qc = QuantumCircuit(src.total_qubits + 9)
          for g in src.gates:
              k = len(g.controls)
              flips = [q for q,b in zip(g.controls,g.expected) if not b]
              for q in flips: qc.x(q)
              if k == 0: qc.x(g.target)
              elif k == 1: qc.cx(g.controls[0], g.target)
              elif k == 2: qc.ccx(*g.controls, g.target)
              else:
                  work = range(src.total_qubits, src.total_qubits+k-2)
                  chain = [(g.controls[0],g.controls[1],work[0])]
                  chain.extend((work[i-2],g.controls[i],work[i-1])
                                for i in range(2,k-1))
                  for a,b,t in chain: qc.ccx(a,b,t)
                  qc.ccx(work[-1], g.controls[-1], g.target)
                  for a,b,t in reversed(chain): qc.ccx(a,b,t)
              for q in flips: qc.x(q)
          assert qc.num_qubits == 164
          assert set(qc.count_ops()).issubset({'x','cx','ccx'})
          basis = transpile(qc, basis_gates=['x','sx','rz','cx'],
                            optimization_level=0)
          assert basis.num_qubits == 164
          assert basis.count_ops().get('cx',0) > 0
          assert set(basis.count_ops()).issubset({'x','sx','rz','cx'})
          # Restrict hardware-scale simulation: only a basis-permutation fixture,
          # using Aer MPS rather than an impossible 2**164 dense statevector.
          state = State(4, 0, 8, 12, 'b')
          action = 8
          expected,_ = run_directional(state,action)
          circuit = QuantumCircuit(qc.num_qubits,18)
          bits = encode_state(state) | (action << 14)
          for q in range(19):
              if (bits >> q) & 1: circuit.x(q)
          circuit.compose(qc,inplace=True)
          circuit.measure(list(range(19,37)),list(range(18)))
          sim = AerSimulator(method='matrix_product_state',max_parallel_threads=2)
          result=sim.run(circuit,shots=1,seed_simulator=20261009).result()
          assert result.success
          assert result.get_counts()=={format(expected,'018b'):1}
          print('Private exact geometry gate-list Qiskit compile and Aer fixture PASS')
          PY
          then
            echo '::error::Private complete KRK Qiskit transpilation / Aer check failed or timed out. Tracebacks withheld.'
            exit 1
          fi
          echo 'Private complete KRK Qiskit transpilation and one Aer basis fixture: PASS.'

      - name: Compile dedicated private QuantumChess Lean theory modules
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-lean' }}
        working-directory: private-src/lean-proofs
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-krk-lean.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          modules=(
            RecordAlgebra/QuantumChess/HistoryQuotient.lean
            RecordAlgebra/QuantumChess/ObservablePolicyCover.lean
            RecordAlgebra/QuantumChess/NecessaryFeatureSeparation.lean
            RecordAlgebra/QuantumChess/CausalRefinementMonotonicity.lean
          )
          for module in "${modules[@]}"; do
            if ! timeout 1200s lake env lean "$module" >"$log_file" 2>&1; then
              echo '::error::Private QuantumChess Lean module failed or timed out. Details suppressed.'
              exit 1
            fi
          done
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "${modules[@]}" >/dev/null; then
            echo '::error::Proof-hole or axiom declaration found in dedicated QuantumChess modules.'
            exit 1
          fi
          echo 'Private QuantumChess Lean modules: PASS (details suppressed).'

      - name: Install Qiskit mpl circuit drawer dependencies
        if: ${{ (inputs.suite || 'materialized-krk') == 'web-krk' || (inputs.suite || 'materialized-krk') == 'uniform-krk' || (inputs.suite || 'materialized-krk') == 'uniform-black-krk' || (inputs.suite || 'materialized-krk') == 'materialized-krk' }}
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/public-mpl.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! python -m pip install 'matplotlib>=3.8,<4' 'pylatexenc>=2.10,<3' >"$log_file" 2>&1; then
            echo '::error::Public Qiskit drawing dependencies failed to install.'
            exit 1
          fi

      - name: Run playable KRK browser backend and Qiskit Aer circuit tests privately
        if: ${{ (inputs.suite || 'materialized-krk') == 'web-krk' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-web-krk.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 2400s python -B -m unittest discover -s chess/experiments/piece_square_play/web -p 'test_*.py' -q >"$log_file" 2>&1; then
            echo '::error::KRK web backend tests failed or timed out. Logs withheld from public runner.'
            exit 1
          fi
          if ! timeout 2400s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_qiskit_aer_play.py' -q >"$log_file" 2>&1; then
            echo '::error::KRK Qiskit Aer circuit tests failed or timed out. Logs withheld from public runner.'
            exit 1
          fi
          if ! timeout 2400s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_compact19.py' -q >"$log_file" 2>&1; then
            echo '::error::Compact 19-qubit KRK Qiskit test failed or timed out. Logs withheld.'
            exit 1
          fi
          echo 'Private playable KRK web and Qiskit Aer tests: PASS (details suppressed).'

      - name: Validate universal KRK transition gates (private, board-controlled)
        if: ${{ (inputs.suite || 'materialized-krk') == 'uniform-krk' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-uniform-krk.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 1800s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_uniform19.py' -q >"$log_file" 2>&1; then
            echo '::error::Uniform 19-bit KRK gate test failed or timed out (private logs suppressed).'
            exit 1
          fi
          if ! timeout 1800s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_uniform19_aer.py' -q >"$log_file" 2>&1; then
            # Only emit our fixed test markers and exception type (never private paths/tracebacks).
            grep -E '^AER_(STAGE|DIAG)_|^(AssertionError|AttributeError|TypeError|ValueError|RuntimeError|NameError|ImportError|SyntaxError|ModuleNotFoundError|MemoryError|QiskitError|AerError):' "$log_file" | sed -E 's/^([A-Za-z]+Error):.*/\\1/' | tail -10 || true
            echo '::error::Uniform KRK full Qiskit Aer execution failed or timed out (traceback suppressed).'
            exit 1
          fi
          echo 'Uniform KRK circuit (basis-only transpile): Qiskit Aer basis-state run PASS.'
          if ! timeout 300s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_black19.py' -q >"$log_file" 2>&1; then
            echo '::error::Black KRK Aer capture/noncapture circuit regression failed; details suppressed.'
            exit 1
          fi
          echo 'Black Qiskit Aer: ordinary move + rook capture terminal sink PASS.'
          if ! timeout 240s python -B -m unittest discover -s chess/experiments/piece_square_play/web -p 'test_web.py' -q >"$log_file" 2>&1; then
            echo '::error::KRK browser integration and human move tests failed (private logs suppressed).'
            exit 1
          fi
          if ! timeout 600s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_compact19.py' -q >"$log_file" 2>&1; then
            grep -E '^COMPACT_(STAGE|DIAG)_' "$log_file" | tail -24 || true
            echo '::error::KRK compact 19-bit Aer proposal regression failed (private logs suppressed).'
            exit 1
          fi
          echo 'Compact controlled X Toffoli decomposition, uniform oracle and web: PASS.'


      - name: Verify board-controlled Black geometry oracle and Qiskit Aer
        if: ${{ (inputs.suite || 'materialized-krk') == 'uniform-black-krk' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-uniform-black.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 1200s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_uniform_black19.py' -q >"$log_file" 2>&1; then
            echo '::error::Uniform Black KRK exhaustive rules parity/ancilla cleanup failed.'
            exit 1
          fi
          echo 'Uniform Black oracle exhaustive canonical comparison PASS.'
          if ! timeout 1200s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_uniform_black19_aer.py' -q >"$log_file" 2>&1; then
            grep '^BLACK_AER_STAGE_' "$log_file" | tail -6 || true
            echo '::error::Uniform Black full Qiskit Aer circuit execution failed.'
            exit 1
          fi
          echo 'Uniform Black oracle full Qiskit Aer capture and superposition PASS.'
          if ! timeout 360s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_black19.py' -q >"$log_file" 2>&1; then
            echo '::error::Fast Black 19-qubit Aer and Toffoli cost regression failed.'
            exit 1
          fi
          echo 'Black optimized and broad multi-position reversible Qiskit parity tests PASS.'
          if ! timeout 420s python -B -m unittest discover -s chess/experiments/piece_square_play/web -p 'test_web.py' -q >"$log_file" 2>&1; then
            # Only stable unittest test names / error class; keep private paths and traces hidden.
            grep -E '^(FAIL|ERROR): test_|^(AssertionError|ValueError|TypeError|AttributeError|KeyError|RuntimeError|NameError):' "$log_file" | sed -E 's/^([A-Za-z]+Error):.*/\\1/' | tail -8 || true
            echo '::error::Shot-based web Qiskit integration regression failed.'
            exit 1
          fi
          if ! timeout 900s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_black_delta19.py' -q >"$log_file" 2>&1; then
            echo '::error::66-qubit Black delta oracle exhaustive geometry test failed.'
            exit 1
          fi
          echo 'Black 66-logical-qubit delta oracle exact parity PASS.'
          if ! timeout 900s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_black_delta19_aer.py' -q >"$log_file" 2>&1; then
            grep '^DELTA_AER_STAGE_' "$log_file" | tail -8 || true
            echo '::error::66-qubit delta oracle shot-based Qiskit Aer test failed.'
            exit 1
          fi
          echo 'Black delta-oracle Aer shot-based capture/nocapture PASS.'
          if ! timeout 180s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_shot_runner.py' -q >"$log_file" 2>&1; then
            echo '::error::Aer/SamplerV2 portable shot histogram adapter regression failed.'
            exit 1
          fi
          echo 'Hardware-compatible SamplerV2/Aer counts contract PASS.'
          echo 'Shot-based browser and optional 66-qubit uniform Black Aer gameplay PASS.'


      - name: Verify coherent materialized KRK two-ply quantum transitions
        if: ${{ (inputs.suite || 'materialized-krk') == 'materialized-krk' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-materialized.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 1200s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_black_materialize19.py' -q >"$log_file" 2>&1; then
            echo '::error::Coherent 19-bit Black materializer parity or clean-work tests failed.'
            exit 1
          fi
          echo 'Materialized Black successor exhaustive KRK + two-ply basis parity PASS.'
          if ! timeout 1300s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_chained_two_ply19_aer.py' -q >"$log_file" 2>&1; then
            grep -E '^TWO_PLY_(AER|SUPERPOSITION)_STAGE_' "$log_file" | tail -9 || true
            grep -E '^(FAIL|ERROR): test_|^(AssertionError|TypeError|ValueError|NameError|AttributeError|IndexError|RuntimeError):' "$log_file" | sed -E 's/^([A-Za-z]+Error):.*/\\1/' | tail -6 || true
            echo '::error::Actual coherent Black-to-White Qiskit Aer two-ply test failed.'
            exit 1
          fi
          echo 'Coherent Black-to-White two-ply (no interposed measurement) Aer PASS.'

      - name: Verify full private D4 trie controller against offline-winning KRK policy
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-controller' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-trie-verify.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          for test_file in test_krk_trie_qrom.py test_complete_trie_d4.py test_complete_trie_toffoli.py; do
            if ! timeout 600s python -B -m unittest discover \
                -s research/chess/theory -p "$test_file" -q >"$log_file" 2>&1; then
              echo '::error::Full private D4 trie controller regression failed; details withheld.'
              exit 1
            fi
          done
          echo 'Private D4 trie policy and full adversarial regression: PASS.'

      - name: Construct and transpile complete private D4 trie controller in Qiskit
        if: ${{ (inputs.suite || 'materialized-krk') == 'theory-controller' }}
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-trie-qiskit.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 1200s python -B - <<'PY' >"$log_file" 2>&1
          import sys
          sys.path.insert(0,"research/chess/theory")
          from qiskit import QuantumCircuit,transpile
          from qiskit_aer import AerSimulator
          from krk_trie_d4_complete import complete_trie
          from geometric_progress import white_states
          from uniform_step import encode_state
          src=complete_trie()
          assert src.total_qubits==118
          assert len(src.gates)==7091
          width=src.total_qubits+7
          circuit=QuantumCircuit(width)
          for gate in src.gates:
              k=len(gate.controls)
              flips=[q for q,b in zip(gate.controls,gate.expected) if not b]
              for q in flips:circuit.x(q)
              if k==0:circuit.x(gate.target)
              elif k==1:circuit.cx(gate.controls[0],gate.target)
              elif k==2:circuit.ccx(*gate.controls,gate.target)
              else:
                  anc=list(range(src.total_qubits,src.total_qubits+k-2))
                  chain=[(gate.controls[0],gate.controls[1],anc[0])]
                  chain += [(anc[i-2],gate.controls[i],anc[i-1]) for i in range(2,k-1)]
                  for a,b,t in chain:circuit.ccx(a,b,t)
                  circuit.ccx(anc[-1],gate.controls[-1],gate.target)
                  for a,b,t in reversed(chain):circuit.ccx(a,b,t)
              for q in flips:circuit.x(q)
          assert circuit.num_qubits==125
          basis=transpile(circuit,basis_gates=['x','sx','rz','cx'],optimization_level=0)
          assert basis.num_qubits==125 and basis.depth()>0
          assert basis.count_ops().get('cx',0)>0
          assert set(basis.count_ops()).issubset({'x','sx','rz','cx'})
          # Basis-only circuit simulation; no 2**125 dense statevector allocation.
          state=white_states()[0]
          expected,_=src.run_basis(state)
          qc=QuantumCircuit(width,5)
          inp=encode_state(state)
          for q in range(19):
              if inp>>q&1:qc.x(q)
          qc.compose(circuit,inplace=True)
          qc.measure([19,20,21,22,23],range(5))
          sim=AerSimulator(method='matrix_product_state',max_parallel_threads=2)
          observed=sim.run(qc,shots=1,seed_simulator=20261009).result()
          assert observed.success
          assert observed.get_counts()=={format(expected,'05b'):1}
          PY
          then
            echo '::error::Complete private D4 trie Qiskit transpilation or Aer fixture failed or timed out; details withheld.'
            exit 1
          fi
          echo 'Complete private D4 trie: Qiskit transpilation and Aer basis fixture PASS.'

      - name: Remove temporary private checkout and reports
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/private-src" "$GITHUB_WORKSPACE/canonical-src"
          rm -f -- "$RUNNER_TEMP"/private-python.* "$RUNNER_TEMP"/private-lean.* \
            "$RUNNER_TEMP"/private-krk.* "$RUNNER_TEMP"/private-qiskit-krk.* "$RUNNER_TEMP"/private-krk-lean.* \
            "$RUNNER_TEMP"/private-trie-verify.* "$RUNNER_TEMP"/private-trie-qiskit.*
          echo 'Ephemeral checkout cleanup complete. No private files committed or uploaded.'
