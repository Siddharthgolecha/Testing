name: Private CheQ Q2 validation (ephemeral)

# Keep private CheQ sources, tests, logs, and artifacts off public Testing.
# Authorize only manual owner dispatch and exact-shape owner-created issues.
# Never checkout private code on pull_request, forks, or untrusted comments.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Pinned 40-hex CheQ commit (public run metadata)'
        required: true
        type: string
      suite:
        description: 'Allowlisted KRK research validation suite'
        required: true
        type: choice
        options:
          - action-search
          - tagged-hopping
          - counter98
          - geometry
          - compact-compile
          - qiskit-native
          - qiskit-full-build
          - spectral-causal
          - live-frustration
          - live-spectrum
          - live-qiskit-build
          - physical-xy-echo
          - joint-xy-trotter
          - local-projector
          - typed-geometry
          - white-local-actions
          - onehot-white-actions
          - lean-causal
          - lean-frustration
          - lean-boundary
        default: action-search
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: cheq-private-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Siddharthgolecha')
      || (github.event_name == 'issues'
          && github.event.issue.user.id == 40235858
          && github.event.issue.title == '[cheq-ci] run')
    name: Read-only CheQ checkout / private-safe pass-fail
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate trusted exact SHA and suite
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DIRECT_SHA: ${{ inputs.source_sha }}
          DIRECT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          allow = {'action-search', 'tagged-hopping', 'counter98',
                   'geometry', 'compact-compile', 'qiskit-native',
                   'qiskit-full-build', 'spectral-causal',
                   'live-frustration', 'live-spectrum',
                   'live-qiskit-build', 'physical-xy-echo',
                   'joint-xy-trotter', 'local-projector',
                   'typed-geometry', 'white-local-actions',
                   'onehot-white-actions',
                   'lean-causal', 'lean-frustration', 'lean-boundary'}
          if os.environ['EVENT_NAME'] == 'issues':
              match = re.fullmatch(
                  r'source_sha: ([0-9a-f]{40})\nsuite: ([a-z0-9-]+)',
                  os.environ.get('ISSUE_BODY', '').strip())
              if match is None:
                  sys.exit('Invalid owner CheQ validation request shape.')
              sha, suite = match.groups()
          else:
              sha = os.environ.get('DIRECT_SHA', '')
              suite = os.environ.get('DIRECT_SUITE', '')
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or suite not in allow:
              sys.exit('Invalid pinned source SHA or unrecognized suite.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fp:
              fp.write(f'source_sha={sha}\nsuite={suite}\n')
          print(f'Authorized owner-only CheQ suite: {suite}; exact source SHA validated.')
          PY

      - name: Checkout public Testing diagnostic key only
        if: ${{ steps.request.outputs.suite == 'lean-boundary' || steps.request.outputs.suite == 'lean-causal' || steps.request.outputs.suite == 'spectral-causal' }}
        uses: actions/checkout@v4
        with:
          path: public-tooling
          persist-credentials: false
          fetch-depth: 1

      - name: Ensure dedicated read-only CheQ deploy key exists
        env:
          CHEQ_KEY: ${{ secrets.CHEQ_DEPLOY_KEY }}
        run: |
          if [[ -z "$CHEQ_KEY" ]]; then
            echo '::error::CHEQ_DEPLOY_KEY is missing in Testing Actions secrets. Install a new CheQ read-only deploy key; do not reuse COALESCENT_DEPLOY_KEY.'
            exit 1
          fi

      - name: Set up Python without source caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout exact private CheQ commit to ephemeral runner
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/CheQ
          ref: ${{ steps.request.outputs.source_sha }}
          ssh-key: ${{ secrets.CHEQ_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-src

      - name: Check pinned checkout integrity
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C private-src rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo '::error::Fetched CheQ revision does not equal requested SHA.'
            exit 1
          }
          echo 'Exact requested CheQ revision checked out into ephemeral runner.'

      - name: Python source syntax verification (private output suppressed)
        run: |
          set -euo pipefail
          logfile="$(mktemp "$RUNNER_TEMP/cheq-syntax.XXXXXX")"
          trap 'rm -f "$logfile"' EXIT
          if ! timeout 180s python -B -m compileall -q \
            private-src/Q2/experiments/hamiltonian_adaptive >"$logfile" 2>&1; then
            echo '::error::Private CheQ syntax compilation FAIL; details suppressed.'
            exit 1
          fi
          echo 'Private CheQ source syntax: PASS.'

      - name: Install pinned Qiskit and Aer for CheQ native gate checks
        if: ${{ steps.request.outputs.suite == 'qiskit-native' || steps.request.outputs.suite == 'qiskit-full-build' || steps.request.outputs.suite == 'spectral-causal' || steps.request.outputs.suite == 'live-frustration' || steps.request.outputs.suite == 'live-spectrum' || steps.request.outputs.suite == 'live-qiskit-build' || steps.request.outputs.suite == 'physical-xy-echo' || steps.request.outputs.suite == 'joint-xy-trotter' || steps.request.outputs.suite == 'local-projector' || steps.request.outputs.suite == 'typed-geometry' || steps.request.outputs.suite == 'white-local-actions' || steps.request.outputs.suite == 'onehot-white-actions' }}
        run: |
          set -euo pipefail
          logfile="$(mktemp "$RUNNER_TEMP/cheq-pip.XXXXXX")"
          trap 'rm -f "$logfile"' EXIT
          if ! timeout 420s python -m pip install --disable-pip-version-check \
            qiskit==2.2.3 qiskit-aer==0.17.2 >"$logfile" 2>&1; then
            echo '::error::Pinned Qiskit/Aer installation failed; details suppressed.'
            exit 1
          fi
          echo 'Qiskit 2.2.3 and Aer 0.17.2 installed.'

      - name: Configure trusted Lean 4.32.1 / Mathlib 4.32.1
        if: ${{ steps.request.outputs.suite == 'lean-boundary' || steps.request.outputs.suite == 'lean-causal' || steps.request.outputs.suite == 'lean-frustration' }}
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: private-src/lean-proofs
          auto-config: 'false'
          build: 'false'
          leanchecker: false
          use-mathlib-cache: 'true'
          use-github-cache: 'false'

      - name: Compile and audit Lean finite Q2 boundary certificate
        if: ${{ steps.request.outputs.suite == 'lean-boundary' || steps.request.outputs.suite == 'lean-causal' || steps.request.outputs.suite == 'lean-frustration' }}
        working-directory: private-src/lean-proofs
        run: |
          set -euo pipefail
          source='RecordAlgebra/QuantumChess/Q2BoundaryCertificate.lean'
          if [[ "${{ steps.request.outputs.suite }}" == 'lean-causal' ]]; then
            source='RecordAlgebra/QuantumChess/CausalSpectralContract.lean'
          fi
          if [[ "${{ steps.request.outputs.suite }}" == 'lean-frustration' ]]; then
            source='RecordAlgebra/QuantumChess/GeometricFrustrationCertificate.lean'
          fi
          logfile="$(mktemp "$RUNNER_TEMP/cheq-lean.XXXXXX")"
          trap 'rm -f "$logfile"' EXIT
          [[ -f "$source" ]] || { echo '::error::Missing pinned Q2 Lean certificate.'; exit 1; }
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' "$source" >"$logfile"; then
            echo '::error::Q2 Lean file contains an explicit proof hole or new axiom.'
            exit 1
          fi
          if ! timeout 1800s lake env lean "$source" >"$logfile" 2>&1; then
            python3 - "$logfile" "$GITHUB_WORKSPACE/public-tooling/diagnostics/cheq-lean-debug-oct25.pub" <<'PY'
          import base64, pathlib, re, subprocess, sys, tempfile
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"(?m)^.*?:\d+:\d+: error:.*$", source)
          if not matches:
              matches = [line for line in source.splitlines()
                         if 'error:' in line.lower() or 'failed' in line.lower()][-4:]
          diagnostic = "\n".join(matches[:3]).encode("utf-8")[:270]
          if not diagnostic:
              diagnostic = b"Lean failed without a recognized error marker."
          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td)
              plain, encrypted = root/'detail', root/'cipher'
              plain.write_bytes(diagnostic)
              result = subprocess.run(
                  ['openssl','pkeyutl','-encrypt','-pubin','-inkey',sys.argv[2],
                   '-pkeyopt','rsa_padding_mode:oaep',
                   '-pkeyopt','rsa_oaep_md:sha256',
                   '-in',str(plain),'-out',str(encrypted)],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if result.returncode == 0:
                  print("ENCRYPTED_CHEQ_LEAN_DIAG_RSA_OAEP_SHA256=" +
                        base64.b64encode(encrypted.read_bytes()).decode("ascii"))
              else:
                  print("::warning::Encrypted Lean diagnosis unavailable.")
          PY
            echo '::error::Finite Q2 boundary Lean compilation FAIL or TIMEOUT; only encrypted diagnostics above.'
            exit 1
          fi
          echo 'Lean Q2 AND/OR threshold + mate/stalemate + XOR specification: PASS.'

      - name: Execute exact CheQ research suite (private output suppressed)
        if: ${{ steps.request.outputs.suite != 'lean-boundary' && steps.request.outputs.suite != 'lean-causal' && steps.request.outputs.suite != 'lean-frustration' }}
        env:
          SUITE: ${{ steps.request.outputs.suite }}
        working-directory: private-src
        run: |
          set -euo pipefail
          case "$SUITE" in
            action-search) pattern='test_coherent_action_search100.py' ;;
            tagged-hopping) pattern='test_tag_corrected_xy.py' ;;
            counter98) pattern='test_compact_reply_counter98.py' ;;
            geometry) pattern='test_live_geometry_oracle.py' ;;
            compact-compile) pattern='test_assembled_gate_list.py' ;;
            qiskit-native) pattern='test_native_qiskit_receipts.py' ;;
            qiskit-full-build) pattern='test_full_qiskit_construction.py' ;;
            spectral-causal) pattern='test_spectral_*.py' ;;
            live-frustration) pattern='test_live_failure_phase100.py' ;;
            live-spectrum) pattern='test_live_frustration_spectrum.py' ;;
            live-qiskit-build) pattern='test_qiskit_live_failure_phase.py' ;;
            physical-xy-echo) pattern='test_physical_xy_policy_echo.py' ;;
            joint-xy-trotter) pattern='test_joint_live_xy_trotter100.py' ;;
            local-projector) pattern='test_local_occupation_legality.py' ;;
            typed-geometry) pattern='test_typed_local_geometry_projectors.py' ;;
            white-local-actions) pattern='test_local_white_action_hamiltonian100.py' ;;
            onehot-white-actions) pattern='test_onehot_local_white_actions100.py' ;;
            lean-causal) echo 'Lean suite should skip Python tests'; exit 1 ;;
            *) echo '::error::Invalid CheQ suite'; exit 1 ;;
          esac
          test_path="Q2/experiments/hamiltonian_adaptive/$pattern"
          if ! compgen -G "$test_path" >/dev/null; then
            echo "::error::Pinned CheQ suite test file is missing; refuse zero-test PASS."
            exit 1
          fi
          logfile="$(mktemp "$RUNNER_TEMP/cheq-private-tests.XXXXXX")"
          trap 'rm -f "$logfile"' EXIT
          if ! timeout 2400s python -B -m unittest discover \
            -s Q2/experiments/hamiltonian_adaptive -p "$pattern" -v \
            >"$logfile" 2>&1; then
            if [[ "$SUITE" == 'live-frustration' || "$SUITE" == 'joint-xy-trotter' || "$SUITE" == 'typed-geometry' || "$SUITE" == 'white-local-actions' || "$SUITE" == 'onehot-white-actions' ]]; then
              python3 - "$logfile" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          failures=re.findall(r'(?m)^(?:FAIL|ERROR): (test_[a-zA-Z0-9_]+) ',text)
          errors=re.findall(r'(?m)^(AssertionError|ImportError|TypeError|ValueError|AttributeError|RuntimeError|ModuleNotFoundError):',text)
          print('Private CheQ failure categories only: ' + ','.join(failures[:6]) +
                '; errors=' + ','.join(errors[:6]))
          if 'joint-xy-trotter' in sys.argv[0] or 'test_true_qiskit' in text:
              n=re.findall(r'test_joint_live_xy_trotter100[.]py", line ([0-9]+)',text)
              print('Joint test failing code line numbers only: ' + ','.join(n[-8:]))
          PY
            fi
            if [[ "$SUITE" == 'spectral-causal' ]]; then
              python3 - "$logfile" "$GITHUB_WORKSPACE/public-tooling/diagnostics/cheq-spectral-debug-oct25.pub" <<'PY'
          import base64,pathlib,re,subprocess,sys,tempfile
          log=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          # Name of failing unittest plus the tail error text. Limit plaintext
          # to RSA-OAEP size; NEVER print private traceback in public logs.
          failures=re.findall(r'(?m)^(?:FAIL|ERROR): [^\n]+',log)
          errors=re.findall(r'(?m)^(?:AssertionError|ImportError|AttributeError|TypeError|ValueError|ModuleNotFoundError|RuntimeError|numpy\.linalg\.LinAlgError):[^\n]*',log)
          payload=('; '.join((failures+errors)[:3]) or 'no categorized Python failure').encode('utf-8')[:260]
          with tempfile.TemporaryDirectory() as tmp:
              p=pathlib.Path(tmp);src=p/'txt';out=p/'cipher';src.write_bytes(payload)
              cmd=['openssl','pkeyutl','-encrypt','-pubin','-inkey',sys.argv[2],
                   '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256',
                   '-in',str(src),'-out',str(out)]
              if subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
                  print('ENCRYPTED_CHEQ_SPECTRAL_DIAG='+base64.b64encode(out.read_bytes()).decode())
              else:print('::warning::Encrypted Python diagnostic unavailable.')
          PY
            fi
            echo "::error::Private CheQ $SUITE FAIL or TIMEOUT. Private logs intentionally suppressed."
            exit 1
          fi
          if ! grep -Eq '^Ran [1-9][0-9]* tests? in ' "$logfile"; then
            echo "::error::No nonzero test-count receipt; reject vacuous suite PASS."
            exit 1
          fi
          if [[ "$SUITE" == 'joint-xy-trotter' ]]; then
            # Publish ONLY scalar gate/resource counts, never private code,
            # traces, raw test logs or circuit dumps.
            metric_log="$(mktemp "$RUNNER_TEMP/cheq-metrics.XXXXXX")"
            if ! PYTHONPATH="Q2/experiments/hamiltonian_adaptive" python -B - >"$metric_log" 2>&1 <<'PY'
          from qiskit import QuantumCircuit,transpile
          from joint_live_xy_trotter100 import append_physical_kinetic,build_joint_qiskit
          from live_failure_phase100 import resources
          qc=QuantumCircuit(19)
          append_physical_kinetic(qc,.24)
          native=transpile(qc,basis_gates=['x','sx','rz','cx'],optimization_level=0)
          full,info=build_joint_qiskit(.24,1)
          live=resources()
          print('CHECKED_Q2_RESOURCE_METRICS_ONLY'
                ' logical_qubits=100'
                ' physical_kinetic_native_CX='+str(native.count_ops().get('cx',0))
                +' physical_kinetic_native_depth='+str(native.depth())
                +' live_failure_logical_blocks='+str(live['abstract_blocks'])
                +' physical_adapter_blocks='+str(info['per_step_decoder_logical_blocks'])
                +' joint_Qiskit_high_level_instructions='+str(full.size())
                +' peak_mcx_controls='+str(live['max_control_count']))
          PY
            then
              echo '::error::Private Q2 scalar metrics computation failed; diagnostics suppressed.'
              rm -f "$metric_log"
              exit 1
            fi
            grep '^CHECKED_Q2_RESOURCE_METRICS_ONLY' "$metric_log" || true
            rm -f "$metric_log"
          fi
          if [[ "$SUITE" == 'white-local-actions' ]]; then
            # Safe scalar resource metrics, no private source or tracebacks.
            metrics="$(mktemp "$RUNNER_TEMP/cheq-local-action-metrics.XXXXXX")"
            if ! PYTHONPATH="Q2/experiments/hamiltonian_adaptive" python -B - >"$metrics" 2>&1 <<'PY'
          from local_white_action_hamiltonian100 import resource_report
          from typed_local_geometry_projectors import resources as typed_resources
          from qiskit import QuantumCircuit,transpile
          from qiskit.circuit.library import PhaseGate
          report=resource_report()
          typed=typed_resources()
          two=QuantumCircuit(2);two.append(PhaseGate(-.23).control(1),[0,1])
          seven=QuantumCircuit(7);seven.append(PhaseGate(-.23).control(6),list(range(7)))
          two_cx=transpile(two,basis_gates=['x','sx','rz','cx'],optimization_level=0).count_ops().get('cx',0)
          seven_cx=transpile(seven,basis_gates=['x','sx','rz','cx'],optimization_level=0).count_ops().get('cx',0)
          print('CHECKED_Q2_LOCAL_ACTION_SCALARS_ONLY'
                +' all_white_action_templates='+str(report['compiled_geometric_templates'])
                +' white_action_diagonal_projector_terms='+str(report['diagonal_projector_terms'])
                +' white_action_max_locality='+str(report['max_operator_locality'])
                +' white_action_full_high_level_instructions='+str(report['total_Qiskit_high_level_instructions'])
                +' rook_attack_terms='+str(typed['projectors']['rook-check']['terms'])
                +' king_adjacency_terms='+str(typed['projectors']['king-adjacency']['terms'])
                +' rook_capture_terms='+str(typed['projectors']['rook-capture']['terms'])
                +' native_2local_CX='+str(two_cx)
                +' native_7local_CX='+str(seven_cx))
          PY
            then
              echo '::error::Private local-projector resource measurement failed; hidden diagnostics.'
              rm -f "$metrics"
              exit 1
            fi
            grep '^CHECKED_Q2_LOCAL_ACTION_SCALARS_ONLY' "$metrics" || true
            rm -f "$metrics"
          fi
          if [[ "$SUITE" == 'onehot-white-actions' ]]; then
            metrics="$(mktemp "$RUNNER_TEMP/cheq-onehot-metrics.XXXXXX")"
            if ! PYTHONPATH="Q2/experiments/hamiltonian_adaptive" python -B - >"$metrics" 2>&1 <<'PY'
          from onehot_local_white_actions100 import resource_report_hot
          from qiskit import QuantumCircuit,transpile
          from qiskit.circuit.library import PhaseGate
          r=resource_report_hot()
          def native_cx(controls):
              qc=QuantumCircuit(controls+1)
              qc.append(PhaseGate(-.27).control(controls),list(range(controls+1)))
              return transpile(qc,basis_gates=['x','sx','rz','cx'],optimization_level=0).count_ops().get('cx',0)
          print('CHECKED_Q2_ONEHOT_RESOURCE_SCALARS_ONLY'
                +' logical_qubits='+str(r['logical_qubits'])
                +' original_max_locality='+str(r['max_operator_locality'])
                +' compressed_max_locality='+str(r['compressed_max_operator_locality'])
                +' diagonal_projectors='+str(r['compressed_projector_terms'])
                +' original_high_level='+str(r['total_Qiskit_high_level_instructions'])
                +' onehot_high_level='+str(r['compressed_Qiskit_high_level_instructions'])
                +' destination_decode_blocks='+str(r['hot_compute_uncompute_mcx'])
                +' representative_7local_native_CX='+str(native_cx(6))
                +' representative_4local_native_CX='+str(native_cx(3)))
          PY
            then
              echo '::error::Private Q2 onehot metric calculation failed; diagnostics suppressed.'
              rm -f "$metrics"
              exit 1
            fi
            grep '^CHECKED_Q2_ONEHOT_RESOURCE_SCALARS_ONLY' "$metrics" || true
            rm -f "$metrics"
          fi
          echo "Private CheQ $SUITE: PASS. Source/test output not published."

      - name: Cleanup ephemeral private checkout
        if: always()
        run: |
          rm -rf -- private-src
          echo 'Ephemeral CheQ source cleared; no private artifacts uploaded.'
