name: SCHI QPE Two-Tier Probe (temporary)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schi-qpe-probe.yml'
permissions:
  contents: read
jobs:
  qpe:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public pinned Qiskit dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r tooling/requirements.txt > "$RUNNER_TEMP/deps.log" 2>&1 || { echo "::error::Qiskit install failed"; exit 1; }
          rm -f "$RUNNER_TEMP/deps.log"
      - name: Checkout exact private PR #171 commit
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/coalescent-research
          ref: 4adc8678dab778be7dfcbc540c6cde1d02237a21
          path: private-src
          ssh-key: ${{ secrets.COALESCENT_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Execute coherent-QPE controller Grover and canonical chess budget tests
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-qpe.XXXX")"
          trap 'rm -f "$log_file"' EXIT
          for test in test_qpe_bounded_forall.py test_chess_qpe_budget.py; do
            if ! timeout 960s python -B -m unittest discover -s chess/experiments/schi_next -p "$test" -v > "$log_file" 2>&1; then
              echo "::error::Failed: $test"
              grep -E '^(FAIL:|ERROR:|FAILED|AssertionError|TypeError|ValueError|QiskitError|ImportError)' "$log_file" | head -12 || true
              exit 1
            fi
            echo "Private suite $test: PASS"
          done
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Clean private checkout and transient outputs
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-src"
          rm -f "$RUNNER_TEMP"/private-qpe.* "$RUNNER_TEMP"/deps.log
