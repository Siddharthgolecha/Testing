name: SCHI QPE Coherent OR Probe (temporary)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schi-qpe-probe.yml'
permissions:
  contents: read
jobs:
  qpe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r tooling/requirements.txt > "$RUNNER_TEMP/deps.log" 2>&1 || { echo "::error::Public Qiskit dependencies failed"; exit 1; }
          rm -f "$RUNNER_TEMP/deps.log"
      - name: Fetch exact private research commit with read-only key
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/coalescent-research
          ref: 0e5c7da5f01c14bacae340e98208de0adc30814f
          path: private-src
          ssh-key: ${{ secrets.COALESCENT_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Run real Qiskit coherent-QPE tests, private log withheld
        working-directory: private-src
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/private-qpe.XXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 900s python -B -m unittest discover -s chess/experiments/schi_next -p 'test_qpe_bounded_forall.py' -v > "$log_file" 2>&1; then
            echo '::error::QPE tests failed; sanitized test identifiers only:'
            grep -E '^(FAIL:|ERROR:|FAILED|AssertionError|TypeError|ValueError|QiskitError|IndexError)' "$log_file" | head -15 || true
            exit 1
          fi
          echo 'QPE coherent-OR native circuit tests passed.'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Clean temporary private checkout
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-src"
          rm -f "$RUNNER_TEMP"/private-qpe.* "$RUNNER_TEMP"/deps.log
          echo 'Private checkout cleanup complete.'
