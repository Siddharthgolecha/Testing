name: Temporary KRK Grover strategy evaluation (remove after test)
on:
  push:
    paths:
      - .github/workflows/tmp-strategy19-eval.yml
permissions:
  contents: read
  statuses: write
concurrency:
  group: temp-strategy19-krk
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Public Testing toolchain
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tooling
      - name: Python Qiskit setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public dependencies
        id: dependencies
        run: |
          python -m pip install -q -r tooling/requirements.txt
          python -m pip install -q 'matplotlib>=3.8,<4' 'pylatexenc>=2.10,<3'
      - name: Private read-only checkout (ephemeral runner only)
        id: private_checkout
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/coalescent-research
          ref: 6ce67a6ba850c6e04bd3d0867114135832a1caa5
          path: private-src
          ssh-key: ${{ secrets.COALESCENT_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Actual Aer optimal-move amplification tests
        id: strategic
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp "$RUNNER_TEMP/strategy-verify.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if ! timeout 900s python -B -m unittest discover -s chess/experiments/piece_square_play -p 'test_strategic19.py' -v >"$log_file" 2>&1; then
            grep -E '^(AssertionError|TypeError|ValueError|RuntimeError|ImportError|SyntaxError|AttributeError|IndexError|ModuleNotFoundError):' "$log_file" | sed -E 's/:.*/ /' | tail -6 || true
            echo '::error::Private Grover strategy tests FAILED; details withheld'
            exit 1
          fi
          grep '^STRATEGY_' "$log_file" | tail -6 || true
          echo 'Private Grover strategy Qiskit Aer tests: PASS'
      - name: Isolated Grover browser integration smoke test
        id: grover_http
        working-directory: private-src/chess/experiments/piece_square_play/web
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log_file="$(mktemp "$RUNNER_TEMP/grover-http.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          if timeout 900s python -B -m unittest test_web.GameHTTPTests.test_tablebase_grover_white_http_path -q >"$log_file" 2>&1; then
            gh api -X POST "repos/Siddharthgolecha/Testing/statuses/$GITHUB_SHA" -f state=success -f context="strategy19/isolated-http-pass"
          else
            gh api -X POST "repos/Siddharthgolecha/Testing/statuses/$GITHUB_SHA" -f state=failure -f context="strategy19/isolated-http-fail"
            exit 1
          fi
      - name: Existing compact circuit and browser regression
        id: regression
        working-directory: private-src
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log_file="$(mktemp "$RUNNER_TEMP/strategy-web.XXXXXX")"
          trap 'rm -f "$log_file"' EXIT
          for suite in "chess/experiments/piece_square_play:test_compact19.py" "chess/experiments/piece_square_play/web:test_web.py"; do
            dir="${suite%%:*}"; test_file="${suite#*:}"
            label=compact
            if [[ "$test_file" == "test_web.py" ]]; then label=web; fi
            if ! timeout 900s python -B -m unittest discover -s "$dir" -p "$test_file" -q >"$log_file" 2>&1; then
              err_kind=$(grep -E '^(AssertionError|TypeError|ValueError|RuntimeError|ImportError|SyntaxError|AttributeError|IndexError|ModuleNotFoundError|QiskitError|AerError):' "$log_file" | tail -1 | cut -d: -f1 || true)
              if [[ -z "$err_kind" ]]; then err_kind=other; fi
              gh api -X POST "repos/Siddharthgolecha/Testing/statuses/$GITHUB_SHA" \
                -f state=failure -f context="strategy19/$label-failed-$err_kind" \
                -f description="Private regression failed; exception type only"
              exit 1
            fi
            gh api -X POST "repos/Siddharthgolecha/Testing/statuses/$GITHUB_SHA" \
              -f state=success -f context="strategy19/$label-passed" \
              -f description="Private regression passed"
          done
      - name: Publish sanitized phase status (no private logs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS: ${{ steps.dependencies.outcome }}
          CHECKOUT: ${{ steps.private_checkout.outcome }}
          STRATEGIC: ${{ steps.strategic.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        shell: bash
        run: |
          for item in "deps:$DEPS" "checkout:$CHECKOUT" "strategic:$STRATEGIC" "regression:$REGRESSION"; do
            name="${item%%:*}"; value="${item#*:}"
            state=success
            if [[ "$value" == "failure" ]]; then state=failure; fi
            gh api -X POST "repos/Siddharthgolecha/Testing/statuses/$GITHUB_SHA" \
              -f state="$state" -f context="strategy19/$name-$value" \
              -f description="Public-safe stage outcome: $name $value"
          done
      - name: Cleanup ephemeral private sources
        if: always()
        shell: bash
        run: |
          rm -rf private-src
          rm -f "$RUNNER_TEMP"/strategy-verify.* "$RUNNER_TEMP"/strategy-web.*
          echo 'Private checkout removed; no source committed to public Testing.'
