name: SCHI Full PR171 Regression (temporary)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schi-full-pr171-regression.yml'
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public Qiskit dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r tooling/requirements.txt > "$RUNNER_TEMP/deps.log" 2>&1 || { echo "::error::Dependency install failure"; exit 1; }
          rm -f "$RUNNER_TEMP/deps.log"
      - uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/coalescent-research
          ref: 3ad73f2a7d0b4fe465248fc82233b500776906c0
          path: private-src
          ssh-key: ${{ secrets.COALESCENT_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Full private SCHI Next canonical, native, QPE, and exact-OR regression
        working-directory: private-src
        run: |
          tmp="$(mktemp "$RUNNER_TEMP/schi-full.XXXX")"
          trap 'rm -f "$tmp"' EXIT
          if ! timeout 2550s python -B -m unittest discover -s chess/experiments/schi_next -p 'test_*.py' -q > "$tmp" 2>&1; then
            echo '::error::Full SCHI regression failed; sanitized identities:'
            grep -E '^(FAIL:|ERROR:|FAILED|AssertionError|TypeError|ValueError|ImportError)' "$tmp" | head -18 || true
            exit 1
          fi
          echo 'Full private SCHI Next test suite PASS.'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Purge private source and private test results
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-src" "$RUNNER_TEMP"/schi-full.* "$RUNNER_TEMP"/deps.log
